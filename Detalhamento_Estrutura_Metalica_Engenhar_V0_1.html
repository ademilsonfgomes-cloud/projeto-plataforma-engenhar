<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detalhamento Metálico Engenhar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: faixa da marca Engenhar + painel de parâmetros à esquerda + prancheta de desenho à direita */
:root{
  --bg:#edf2f7; --panel:#ffffff; --ink:#1b2c3e; --muted:#586c7c; --line:#d2dce6;
  --brand:#102e4b; --brand-ink:#ffffff; --brand-sub:#bed6ea; --accent:#174a78; --accent-ink:#ffffff;
  --sheet:#fbfcfd; --grid:#e8edf2;
  --warn-bg:#fff3dc; --warn-ink:#744800; --warn-line:#f0d39a; --ok-bg:#e3f3e5; --ok-ink:#1f6b2a;
  --d-pilar:#1d55a0; --d-viga:#b0261c; --d-terca:#2a7a2f; --d-trav:#00798a; --d-contrav:#8a2ca2;
  --d-chapa:#a35300; --d-cota:#6e5a00; --d-eixo:#7c8796; --d-txt:#1b2c3e; --d-anot:#4c5868;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17202a; --ink:#e3eaf1; --muted:#93a3b3; --line:#2a3644;
  --brand:#0b2238; --brand-ink:#ffffff; --brand-sub:#9fc0dc; --accent:#6fa3d6; --accent-ink:#0b1824;
  --sheet:#111922; --grid:#18222d;
  --warn-bg:#2e2410; --warn-ink:#f2c879; --warn-line:#5a4520; --ok-bg:#16301b; --ok-ink:#8fd99a;
  --d-pilar:#72a9f2; --d-viga:#ff8074; --d-terca:#74cf7a; --d-trav:#4fd2e2; --d-contrav:#d39be0;
  --d-chapa:#ffaf55; --d-cota:#e2c348; --d-eixo:#7f8c9b; --d-txt:#e3eaf1; --d-anot:#a8b5c2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17202a; --ink:#e3eaf1; --muted:#93a3b3; --line:#2a3644;
  --brand:#0b2238; --brand-ink:#ffffff; --brand-sub:#9fc0dc; --accent:#6fa3d6; --accent-ink:#0b1824;
  --sheet:#111922; --grid:#18222d;
  --warn-bg:#2e2410; --warn-ink:#f2c879; --warn-line:#5a4520; --ok-bg:#16301b; --ok-ink:#8fd99a;
  --d-pilar:#72a9f2; --d-viga:#ff8074; --d-terca:#74cf7a; --d-trav:#4fd2e2; --d-contrav:#d39be0;
  --d-chapa:#ffaf55; --d-cota:#e2c348; --d-eixo:#7f8c9b; --d-txt:#e3eaf1; --d-anot:#a8b5c2;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--brand);color:var(--brand-ink);padding-block:14px}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:grid;gap:2px}
.brand small{font:500 11px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--brand-sub)}
.brand h1{margin:0;font:700 26px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.actions button{background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.28)}
.actions button:hover{border-color:var(--brand-ink)}
.actions button.primary{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
button{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 11px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding-block:16px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
aside details+details{border-top:1px solid var(--line)}
aside summary{padding:11px 14px;font:600 15px var(--f-disp);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;color:var(--accent)}
.fields{display:grid;gap:9px;padding:0 14px 14px}
.f{display:grid;grid-template-columns:minmax(0,1fr) 128px;align-items:center;gap:8px}
.f.wide{grid-template-columns:minmax(0,1fr);gap:4px}
.f.ck{grid-template-columns:minmax(0,1fr) auto}
.f.ck input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.f label{font-size:13px;color:var(--muted)}
.in{display:flex;align-items:center;gap:5px;min-width:0}
input,select{width:100%;min-width:0;font:13px var(--f-mono);padding:6px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.unit{font:12px var(--f-mono);color:var(--muted);min-width:24px}
.about{padding:12px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.about p{margin:0 0 6px}
main{min-width:0;display:grid;gap:12px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;display:grid;gap:2px;min-width:0}
.kpi span{font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{font:600 19px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi i{font:12px var(--f-mono);font-style:normal;color:var(--muted)}
.warns{display:grid;gap:6px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:6px;padding:7px 11px;font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 12px;font:600 15px var(--f-disp);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stage{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:8px;height:clamp(380px,68vh,880px);overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage svg:active,.stage canvas:active{cursor:grabbing}
.hint{position:absolute;left:10px;bottom:8px;font:11px var(--f-mono);color:var(--muted);background:var(--sheet);padding:2px 6px;border-radius:4px;pointer-events:none}
.stage-tools{position:absolute;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.legend{position:absolute;left:10px;top:10px;display:grid;gap:3px;font:12px var(--f-body);background:var(--sheet);padding:6px 9px;border:1px solid var(--line);border-radius:6px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.rom,.lig{display:grid;gap:14px}
.chip{display:inline-block;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}.chip.al{background:var(--warn-bg);color:var(--warn-ink)}
td.chk{white-space:normal;min-width:260px}
td.chk ul{margin:4px 0 0;padding-left:18px}
.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.table-wrap h3{font:600 16px var(--f-disp);text-transform:uppercase;letter-spacing:.07em;margin:12px 12px 8px;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--bg)}
td.mk{font:600 13px var(--f-mono);color:var(--accent)}
tr.tot td{font-weight:600;border-bottom:0}
.rom-tools{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:20}
.toast.on{opacity:1}
svg text{font-family:var(--f-disp);font-weight:500}
.ly{fill:none;stroke-width:1.1px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.ly-PILAR{stroke:var(--d-pilar);stroke-width:1.6px}.ly-VIGA{stroke:var(--d-viga);stroke-width:1.6px}
.ly-TERCA{stroke:var(--d-terca)}.ly-TRAVESSA{stroke:var(--d-trav)}.ly-CONTRAV{stroke:var(--d-contrav)}
.ly-CHAPA{stroke:var(--d-chapa)}.ly-COTA{stroke:var(--d-cota);stroke-width:.8px}.ly-EIXO{stroke:var(--d-eixo);stroke-width:.7px}
.ly-TEXTO{stroke:var(--d-txt)}.ly-ANOT{stroke:var(--d-anot);stroke-width:.9px}
.tx-TEXTO{fill:var(--d-txt)}.tx-COTA{fill:var(--d-cota)}.tx-ANOT,.tx-EIXO{fill:var(--d-anot)}.tx-CHAPA{fill:var(--d-chapa)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top gutter">
  <div class="top-in">
    <div class="brand"><small>Engenhar · V0.1 · protótipo</small><h1>Detalhamento de Estrutura Metálica</h1></div>
    <div class="actions">
      <button id="bDxfView" class="primary" type="button">DXF desta vista</button>
      <button id="bDxfAll" type="button">DXF completo</button>
      <button id="bCopyDxf" type="button">Copiar DXF</button>
      <button id="bSave" type="button">Salvar projeto</button>
      <button id="bOpen" type="button">Abrir projeto</button>
      <input id="fileOpen" type="file" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<div class="wrap gutter">
  <aside>
    <form id="form" autocomplete="off"></form>
    <div class="about">
      <p><strong>Só detalhamento.</strong> Os perfis informados aqui devem vir do dimensionamento. O programa gera a geometria, as marcas, os desenhos e o romaneio.</p>
      <p>Confira os desenhos antes de liberar para a fábrica.</p>
      <button id="bReset" type="button">Restaurar exemplo</button>
    </div>
  </aside>

  <main>
    <section class="summary" id="summary" aria-label="Resumo"></section>
    <section class="warns" id="warns" aria-live="polite"></section>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section class="stage" id="stage">
      <canvas id="cv" hidden></canvas>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" hidden></svg>
      <div class="legend" id="legend" hidden></div>
      <div class="stage-tools"><button id="bFit" type="button">Enquadrar</button></div>
      <div class="hint" id="hint"></div>
    </section>
    <section class="lig" id="lig" hidden></section>
    <section class="rom" id="rom" hidden></section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R5=v=>Math.round(v/5)*5;
const nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const numBR=v=>String(v).replace('.',',');

/* ---------------- Catálogo de perfis ---------------- */
// W laminados: [nome, d, bf, tw, tf, kg/m]
const W_DATA=[
 ['W150x13.0',148,100,4.3,4.9,13.0],['W150x18.0',153,102,5.8,7.1,18.0],
 ['W200x15.0',200,100,4.3,5.2,15.0],['W200x19.3',203,102,5.8,6.5,19.3],['W200x26.6',207,133,5.8,8.4,26.6],
 ['W250x17.9',251,101,4.8,5.3,17.9],['W250x25.3',257,102,6.1,8.4,25.3],['W250x32.7',258,146,6.1,9.1,32.7],
 ['W310x21.0',303,101,5.1,5.7,21.0],['W310x28.3',309,102,6.0,8.9,28.3],['W310x32.7',313,102,6.6,10.8,32.7],
 ['W360x32.9',349,127,5.8,8.5,32.9],['W360x39.0',353,128,6.5,10.7,39.0],
 ['W410x38.8',399,140,6.4,8.8,38.8],['W460x52.0',450,152,7.6,10.8,52.0]];
// Ue dobrados: [h, b, c, t]
const UE_DATA=[[100,50,17,2.00],[100,50,17,2.65],[127,50,17,2.25],[127,50,17,2.65],[150,60,20,2.00],[150,60,20,2.65],[150,60,20,3.00],
 [200,75,25,2.00],[200,75,25,2.65],[200,75,25,3.00],[200,75,25,3.35],[250,85,25,2.65],[250,85,25,3.00],[250,85,25,3.35],[300,85,25,3.00],[300,85,25,3.35]];
const BAR_DATA=[10,12.5,16,20,22.2,25];
// Cantoneiras de abas iguais: [chave, nome comercial, aba (mm), espessura (mm), kg/m]
const ANG_DATA=[['L38x3.2','L 1½" x ⅛"',38,3.2,1.83],['L38x4.8','L 1½" x 3/16"',38,4.8,2.68],['L51x3.2','L 2" x ⅛"',51,3.2,2.46],
 ['L51x4.8','L 2" x 3/16"',51,4.8,3.63],['L64x4.8','L 2½" x 3/16"',64,4.8,4.57]];
const CAT={};
W_DATA.forEach(([n,d,bf,tw,tf,kgm])=>CAT[n]={key:n,kind:'W',label:n.replace('.',','),d,bf,tw,tf,kgm});
UE_DATA.forEach(([h,b,c,t])=>{const key=`Ue${h}x${b}x${c}x${t.toFixed(2)}`;const A=t*(h+2*b+2*c-4*t);
  CAT[key]={key,kind:'Ue',label:`Ue ${h}x${b}x${c}x${t.toFixed(2).replace('.',',')}`,d:h,bf:b,c,t,tw:t,tf:t,kgm:A*0.00785};});
BAR_DATA.forEach(dia=>{const key='R'+dia;CAT[key]={key,kind:'R',label:'Barra ø'+numBR(dia),d:dia,bf:dia,kgm:Math.PI*dia*dia/4*0.00785};});
ANG_DATA.forEach(([key,com,b,t,kgm])=>CAT[key]={key,kind:'L',label:`${com} (${b}x${numBR(t)})`,d:b,bf:b,t,tw:t,tf:t,kgm});
const byKind=k=>Object.values(CAT).filter(c=>c.kind===k);
const OPT_FRAME=()=>[['Laminados W',byKind('W')],['Dobrados Ue',byKind('Ue')]];
const OPT_LIGHT=()=>[['Dobrados Ue',byKind('Ue')],['Laminados W',byKind('W')]];
const OPT_BAR=()=>[['Barras redondas',byKind('R')]];
const OPT_ANG=()=>[['Cantoneiras',byKind('L')]];

/* ---------------- Parâmetros ---------------- */
const GROUPS=[
 {t:'Geometria',open:true,f:[
  {id:'vao',label:'Vão (eixo a eixo)',unit:'m',def:15,kind:'num',min:4,max:40,step:.5},
  {id:'comp',label:'Comprimento',unit:'m',def:30,kind:'num',min:3,max:200,step:.5},
  {id:'pd',label:'Pé-direito (topo da placa ao eixo da viga)',unit:'m',def:6,kind:'num',min:2.5,max:15,step:.1},
  {id:'incl',label:'Inclinação do telhado',unit:'%',def:10,kind:'num',min:2,max:50,step:1},
  {id:'espP',label:'Distância máx. entre pórticos',unit:'m',def:6,kind:'num',min:2,max:12,step:.5}]},
 {t:'Perfis',open:true,f:[
  {id:'pPilar',label:'Pilares',kind:'prof',def:'W250x32.7',opts:OPT_FRAME},
  {id:'pViga',label:'Vigas de cobertura',kind:'prof',def:'W310x28.3',opts:OPT_FRAME},
  {id:'pTerca',label:'Terças',kind:'prof',def:'Ue200x75x25x2.65',opts:OPT_LIGHT},
  {id:'pTrav',label:'Travessas laterais',kind:'prof',def:'Ue150x60x20x2.00',opts:OPT_LIGHT},
  {id:'pCB',label:'Contraventamento da cobertura',kind:'prof',def:'R16',opts:OPT_BAR},
  {id:'pCL',label:'Contraventamento lateral',kind:'prof',def:'R16',opts:OPT_BAR}]},
 {t:'Terças e fechamento',f:[
  {id:'espT',label:'Espaçamento máx. das terças (na rampa)',unit:'m',def:1.8,kind:'num',min:.6,max:3,step:.1},
  {id:'mureta',label:'Altura da alvenaria (mureta)',unit:'m',def:1.2,kind:'num',min:0,max:6,step:.1},
  {id:'espTr',label:'Espaçamento máx. das travessas',unit:'m',def:1.8,kind:'num',min:.6,max:3,step:.1}]},
 {t:'Oitões (frente e fundo)',f:[
  {id:'oitao',label:'Fechar os oitões com pilaretes',kind:'chk',def:true},
  {id:'espPil',label:'Distância máx. entre pilaretes',unit:'m',def:5,kind:'num',min:2,max:10,step:.5},
  {id:'pPil',label:'Pilaretes',kind:'prof',def:'W150x13.0',opts:OPT_FRAME}]},
 {t:'Mão-francesa',f:[
  {id:'mfViga',label:'Nas vigas (apoiada nas terças)',kind:'chk',def:true},
  {id:'mfPil',label:'Nos pilares (apoiada nas travessas)',kind:'chk',def:false},
  {id:'mfN',label:'Colocar a cada',unit:'peças',def:0,kind:'opt',opts:[0,1,2,3],zero:'auto (≤ 2,5 m)'},
  {id:'pMF',label:'Perfil da mão-francesa',kind:'prof',def:'L38x3.2',opts:OPT_ANG}]},
 {t:'Ligações',f:[
  {id:'baseEng',label:'Base engastada (4 chumbadores fora das mesas)',kind:'chk',def:true},
  {id:'tBase',label:'Placa de base (espessura)',unit:'mm',def:19,kind:'opt',opts:[12.5,16,19,22.4,25,31.5]},
  {id:'dCh',label:'Chumbadores (diâmetro)',unit:'mm',def:19,kind:'opt',opts:[16,19,22,25,32]},
  {id:'tTopo',label:'Chapas de topo (espessura)',unit:'mm',def:16,kind:'opt',opts:[12.5,16,19,22.4,25]},
  {id:'dPar',label:'Parafusos viga-pilar e cumeeira (diâmetro)',unit:'mm',def:16,kind:'opt',opts:[12.5,16,19,22,25]},
  {id:'nbVP',label:'Parafusos na ligação viga-pilar',unit:'un',def:6,kind:'opt',opts:[4,6,8]},
  {id:'nbC',label:'Parafusos na emenda da cumeeira',unit:'un',def:6,kind:'opt',opts:[4,6,8]},
  {id:'gab',label:'Gabarito dos parafusos (0 = automático)',unit:'mm',def:0,kind:'num',min:0,max:300,step:5},
  {id:'dParT',label:'Parafusos de terças e travessas (diâmetro)',unit:'mm',def:12.5,kind:'opt',opts:[12.5,16]}]},
 {t:'Identificação',f:[
  {id:'obra',label:'Obra',kind:'txt',def:'Galpão exemplo 15 x 30 m'},
  {id:'cliente',label:'Cliente',kind:'txt',def:''},
  {id:'resp',label:'Responsável técnico',kind:'txt',def:''}]}];
const FIELDS=GROUPS.flatMap(g=>g.f);
const DEFAULTS=Object.fromEntries(FIELDS.map(f=>[f.id,f.def]));
const STORE='engenhar-metalica-v3';
let P=loadState();
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&s.p)return sanitize(s.p);}catch(e){}return {...DEFAULTS};}
function sanitize(o){const p={...DEFAULTS};for(const f of FIELDS){const v=o[f.id];if(v==null)continue;
  if(f.kind==='num'||f.kind==='opt'){const n=parseFloat(String(v).replace(',','.'));if(isFinite(n))p[f.id]=f.kind==='num'?Math.min(f.max,Math.max(f.min,n)):n;}
  else if(f.kind==='prof'){if(CAT[v])p[f.id]=v;}else if(f.kind==='chk')p[f.id]=v===true||v==='true';else p[f.id]=String(v).slice(0,120);}return p;}
function saveState(){try{localStorage.setItem(STORE,JSON.stringify({p:P,tab:TAB}));}catch(e){}}

/* ---------------- Modelo ---------------- */
const TYPE_ORDER=['pilar','viga','pilarete','terca','travessa','mf','cb','cl'];
const PRE={pilar:'P',viga:'V',pilarete:'PL',terca:'T',travessa:'TL',mf:'MF',cb:'CB',cl:'CL'};
const DESC={pilar:'Pilar',viga:'Viga de cobertura',pilarete:'Pilarete de oitão',terca:'Terça',travessa:'Travessa',mf:'Mão-francesa',cb:'Contraventamento da cobertura',cl:'Contraventamento lateral'};

/* ---------------- Regras de detalhamento de ligações ---------------- */
// Bordas (centro do furo à borda): [borda cortada, borda laminada].
// Mínimos da NBR 8800:2008, Tabela 14, elevados ao padrão do Manual de Ligações Gerdau/CBCA
// (30 mm para 5/8" e 40 mm para os demais, em chapas).
const EDGE_T={12.5:[22,19],16:[30,22],19:[40,26],20:[40,27],22:[40,29],25:[44,32]};
const HOLE_T={12.5:14,16:18,19:21,22:24,25:27};   // furos padrão do Manual de Ligações Gerdau
const R5up=v=>Math.ceil(v/5-1e-9)*5;
const edgeOf=d=>EDGE_T[d]||[R5up(1.75*d),R5up(1.25*d)];
const spcOf=d=>d>=16?(d<=16?60:75):R5up(3*d);    // espaçamento padrão entre furos (Gerdau: 60 mm para 5/8", 75 mm para os demais)
const clrOf=d=>R5(1.5*d+8);          // folga para aperto: face da mesa/alma ao centro do furo
const holeOf=d=>HOLE_T[d]||Math.ceil(d+2);
const deg1=v=>nf1.format(v);

// Chapa de topo: linhas de parafusos medidas na vertical a partir do eixo da viga
function endPlate(V,cs,nb,d,t,side,gab){
  const [e]=edgeOf(d),C=clrOf(d),dz=V.d/cs,tfz=V.tf/cs,top=dz/2,bot=-dz/2;
  let rows;
  if(nb===8)rows=[top+C,top-tfz-C,bot+tfz+C,bot-C];
  else{const up=side==='top',ext=up?[top+C,top-tfz-C]:[bot-C,bot+tfz+C];rows=nb===6?[...ext,up?bot+tfz+C:top-tfz-C]:ext;}
  rows=rows.map(r=>Math.round(r)).sort((a,b)=>b-a);
  const extTop=nb===8||side==='top',extBot=nb===8||side==='bot';
  const yTop=Math.round(extTop?top+C+e:top+10),H=R5up(yTop-(extBot?bot-C-e:bot-10)),yBot=yTop-H;
  const g=gab>0?gab:R5up(Math.max(spcOf(d),V.tw+2*C)),W=R5up(Math.max(V.bf+20,g+2*e));
  return {nb,d,t,hole:holeOf(d),e,C,g,W,H,yTop,yBot,rows,dz,tfz};
}
function checkEndPlate(L,V,colP){
  const out=[],d=L.d;
  for(let k=0;k<L.rows.length-1;k++){const s=L.rows[k]-L.rows[k+1];if(s<3*d)out.push(`Distância entre linhas de parafusos de ${s} mm, menor que 3d = ${numBR(3*d)} mm.`);}
  if(L.g<3*d)out.push(`Gabarito de ${L.g} mm, menor que 3d = ${numBR(3*d)} mm.`);
  if(L.g<V.tw+2*L.C)out.push(`Gabarito de ${L.g} mm não deixa folga para apertar junto à alma (mínimo ${R5up(V.tw+2*L.C)} mm).`);
  if((L.W-L.g)/2<L.e)out.push(`Borda lateral da chapa de ${nf1.format((L.W-L.g)/2)} mm, menor que ${L.e} mm.`);
  if(colP){const er=edgeOf(d)[1],b=(colP.bf-L.g)/2;if(b<er)out.push(`Os furos não cabem na mesa do pilar ${colP.label}: borda de ${nf1.format(b)} mm, menor que ${er} mm.`);}
  return out;
}
// Suporte (chapa soldada) para terça ou travessa: 2 parafusos por ponta de peça
function cleat(T,d,gap){
  const [e]=edgeOf(d),s=R5(Math.max(spcOf(d),T.d*.4)),xh=gap/2+e;
  return {d,hole:holeOf(d),e,s,xh,gap,t:6.3,W:R5up(Math.max(100,2*(xh+e))),H:R5up(T.d/2+s/2+e)};
}
function checkCleat(c,T){
  const out=[],C=clrOf(c.d);
  if(c.s<3*c.d)out.push(`Espaçamento dos furos de ${c.s} mm, menor que 3d.`);
  const f=(T.d-c.s)/2-(T.t||T.tf);
  if(f<C)out.push(`Furos a ${nf1.format(f)} mm da mesa da peça ${T.label}: sem folga para aperto (mínimo ${C} mm).`);
  return out;
}

function build(p){
  const B=p.vao*1000,L=p.comp*1000,H=p.pd*1000,i=p.incl/100,th=Math.atan(i),cs=Math.cos(th),sn=Math.sin(th);
  const nV=Math.max(1,Math.ceil(L/(p.espP*1000)-1e-6)),e=L/nV,nF=nV+1,Zr=H+i*B/2;
  const ys=Array.from({length:nF},(_,k)=>k*e);
  const Pp=CAT[p.pPilar],Vp=CAT[p.pViga],Tp=CAT[p.pTerca],TRp=CAT[p.pTrav],CBp=CAT[p.pCB],CLp=CAT[p.pCL];
  const hv=Vp.d/(2*cs);
  const Lvp=endPlate(Vp,cs,p.nbVP,p.dPar,p.tTopo,'top',p.gab);
  const Lc=endPlate(Vp,cs,p.nbC,p.dPar,p.tTopo,'bot',p.gab);
  const zFace=H+(Pp.d/2)*i;
  const colCut=Math.round(zFace+Lvp.yTop);   // topo do pilar alinhado com o topo da chapa CT1
  const rafCut=Math.round((B/2-Pp.d/2)/cs-2*p.tTopo);
  const Ls=(B/2)/cs;
  // terças: da 1ª a 150 mm do eixo do beiral até 150 mm da cumeeira
  const s0=150,s1=Ls-150;const nT=Math.max(2,Math.ceil((s1-s0)/(p.espT*1000)-1e-6)+1);
  const purS=Array.from({length:nT},(_,k)=>s0+k*(s1-s0)/(nT-1));
  const purX=[...purS.map(s=>s*cs),...purS.map(s=>B-s*cs)].sort((a,b)=>a-b);
  // travessas: do topo da alvenaria até 300 mm abaixo do pé-direito
  const mur=p.mureta*1000,gTop=H-300;let girtZ=[];
  if(gTop>mur+50){const nG=Math.max(2,Math.ceil((gTop-mur)/(p.espTr*1000)-1e-6)+1);girtZ=Array.from({length:nG},(_,k)=>mur+k*(gTop-mur)/(nG-1));}
  const mem=[];const add=(type,prof,a,b,cut,x)=>mem.push({type,prof,a,b,cut:Math.round(cut),...(x||{})});
  // oitões: pilaretes sob a viga do pórtico de extremidade
  const PLp=CAT[p.pPil],MFp=CAT[p.pMF];
  const zBotAt=x=>H+Math.min(x,B-x)*i-hv;            // face inferior da viga na posição x
  let pilX=[];
  if(p.oitao){const n=Math.max(1,Math.ceil(B/(p.espPil*1000)-1e-6));pilX=Array.from({length:n-1},(_,k)=>(k+1)*B/n);}
  const dpt=p.dPar,ePt=edgeOf(dpt)[0],ybPt=Math.max(ePt,40),slotPt=R5up(holeOf(dpt)+25),gapPt=50,sPt=R5up(Math.max(3*dpt,40));
  const CP={mark:'CP1',desc:'Chapa do topo do pilarete (furos oblongos)',t:9.5,W:R5up(sPt+2*ePt),L:R5up(gapPt+ybPt+slotPt/2+ePt),qty:2*pilX.length,
    s:sPt,slot:slotPt,gap:gapPt,yb:ybPt,e:ePt,d:dpt,hole:holeOf(dpt)};
  const pilTop=x=>Math.round(zBotAt(x)-gapPt);
  // mão-francesa: liga a terça (ou travessa) à mesa inferior da viga (ou interna do pilar), a 45°
  const cMF=40,yMF=35,eMF=edgeOf(p.dParT)[0];
  const mfG=Sd=>{const dz=cMF+Sd+40,a=yMF+dz,L0=Math.hypot(dz,a-yMF);return {dz,a,L0,cut:Math.round(L0+2*eMF)};};
  const mfV=mfG(Vp.d),mfP=mfG(Pp.d);
  // Manual de Galpões Gerdau: mesa comprimida da viga contida a cada 2,5 m no máximo
  const LB_MAX=2500,stepOf=a=>a.length>1?a[1]-a[0]:1e9;
  const nOf=a=>p.mfN||Math.max(1,Math.floor(LB_MAX/stepOf(a)+1e-6));
  const mfNv=nOf(purS),mfNp=nOf(girtZ);
  const pick=(arr,N)=>arr.filter((_,k)=>k>0&&k<arr.length-1&&k%N===0);
  const mfS=p.mfViga?pick(purS,mfNv):[],mfZ=p.mfPil?pick(girtZ,mfNp):[];
  const mfLbV=mfNv*stepOf(purS);
  const CM={mark:'CM1',desc:'Chapa da mão-francesa',t:6.3,W:R5up(2*(yMF+eMF)),L:R5up(40+eMF),qty:0};
  const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
  ys.forEach(y=>{
    add('pilar',Pp,[0,y,0],[0,y,colCut],colCut);add('pilar',Pp,[B,y,0],[B,y,colCut],colCut);
    add('viga',Vp,[0,y,H],[B/2,y,Zr],rafCut);add('viga',Vp,[B,y,H],[B/2,y,Zr],rafCut);});
  for(let j=0;j<nV;j++){const y0=ys[j],y1=ys[j+1];
    purS.forEach(s=>{const x=s*cs,z=H+s*sn+hv;add('terca',Tp,[x,y0,z],[x,y1,z],e-10);add('terca',Tp,[B-x,y0,z],[B-x,y1,z],e-10);});
    girtZ.forEach(z=>{add('travessa',TRp,[0,y0,z],[0,y1,z],e-10);add('travessa',TRp,[B,y0,z],[B,y1,z],e-10);});}
  const mfPts=[];
  ys.forEach((y,k)=>{const sg=k===0?[1]:k===nV?[-1]:[1,-1];
    mfS.forEach(s=>[0,1].forEach(side=>{
      const rp=(n,yy)=>side?[B-s*cs+sn*n,yy,H+s*sn+cs*n]:[s*cs-sn*n,yy,H+s*sn+cs*n];
      sg.forEach(g=>add('mf',MFp,rp(-(Vp.d/2+40),y+g*yMF),rp(Vp.d/2+cMF,y+g*mfV.a),mfV.cut));mfPts.push({kind:'LMF',sides:sg.length});}));
    mfZ.forEach(z=>[0,B].forEach(x=>{const o=x===0?-1:1,cp=(n,yy)=>[x+o*n,yy,z];
      sg.forEach(g=>add('mf',MFp,cp(-(Pp.d/2+40),y+g*yMF),cp(Pp.d/2+cMF,y+g*mfP.a),mfP.cut));mfPts.push({kind:'LMP',sides:sg.length});}));});
  CM.qty=mfPts.length;
  const endYs=pilX.length?[0,L]:[],girtEnds=new Map();
  endYs.forEach(y=>{
    pilX.forEach(x=>add('pilarete',PLp,[x,y,0],[x,y,pilTop(x)],pilTop(x)));
    const sup=[0,...pilX,B];
    for(let j=0;j<sup.length-1;j++){const xa=sup[j],xb=sup[j+1],zl=Math.min(pilTop(xa),pilTop(xb),zBotAt(xa),zBotAt(xb))-TRp.d/2-150;
      girtZ.filter(z=>z<=zl).forEach(z=>{add('travessa',TRp,[xa,y,z],[xb,y,z],xb-xa-10,{oit:true});
        [xa,xb].forEach(x=>{const k=`${y}|${x}|${Math.round(z)}`;girtEnds.set(k,(girtEnds.get(k)||0)+1);});});}});
  const braced=nV===1?[0]:[0,nV-1];
  braced.forEach(j=>{const y0=ys[j],y1=ys[j+1];
    [[0,B/2],[B,B/2]].forEach(([xe,xr])=>{const a=[xe,y0,H],b=[xr,y1,Zr],c=[xr,y0,Zr],d=[xe,y1,H];add('cb',CBp,a,b,dist(a,b)+200);add('cb',CBp,c,d,dist(c,d)+200);});
    [0,B].forEach(x=>{const a=[x,y0,0],b=[x,y1,H],c=[x,y0,H],d=[x,y1,0];add('cl',CLp,a,b,dist(a,b)+200);add('cl',CLp,c,d,dist(c,d)+200);});});
  // marcas
  const gmap=new Map();
  for(const m of mem){const k=`${m.type}|${m.prof.key}|${m.cut}`;if(!gmap.has(k))gmap.set(k,{type:m.type,prof:m.prof,cut:m.cut,qty:0});gmap.get(k).qty++;m.gk=k;}
  const groups=[...gmap.values()].sort((a,b)=>TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type)||b.cut-a.cut);
  const cnt={};groups.forEach(g=>{cnt[g.type]=(cnt[g.type]||0)+1;g.mark=PRE[g.type]+cnt[g.type];g.kgUn=g.cut/1000*g.prof.kgm;g.kgTot=g.kgUn*g.qty;});
  mem.forEach(m=>m.mark=gmap.get(m.gk).mark);
  // chapas
  const dCh=p.dCh,eCh=edgeOf(dCh)[0],aF=Math.max(R5(2*dCh),clrOf(dCh)),ed=R5up(Math.max(eCh,1.75*dCh));
  // chumbador: comprimento e rosca conforme a tabela de bases do Manual de Galpões Gerdau (ø25: 750 mm, rosca 175 mm)
  const Lch=Math.ceil(Math.max(600,30*dCh)/50)*50,rosca=Math.ceil(Math.max(100,7*dCh)/25)*25;
  const basePlate=(pr,mark,desc,qty)=>{
    if(p.baseEng){const g=Math.max(pr.bf,R5(3*dCh));return {mark,desc,prof:pr,eng:true,t:p.tBase,W:g+2*ed,L:pr.d+2*(aF+ed),qty,hole:dCh+6,a:aF,ed,g,Lch,rosca,
      holes:[[-g/2,-(pr.d/2+aF)],[g/2,-(pr.d/2+aF)],[-g/2,pr.d/2+aF],[g/2,pr.d/2+aF]]};}
    // rotulada (Manual de Ligações Gerdau, base PBR): 2 chumbadores entre as mesas, um de cada lado da alma
    const g=R5up(Math.max(pr.tw+2*clrOf(dCh),3*dCh));
    return {mark,desc,prof:pr,eng:false,t:p.tBase,W:R5up(Math.max(pr.bf+50,g+2*ed)),L:R5up(pr.d+50),qty,hole:dCh+6,a:0,ed,g,Lch,rosca,holes:[[-g/2,0],[g/2,0]]};};
  const PB=basePlate(Pp,'PB1','Placa de base do pilar',2*nF),PB2=basePlate(PLp,'PB2','Placa de base do pilarete',2*pilX.length),g=PB.g;
  const CT={mark:'CT1',desc:'Chapa de topo viga-pilar',t:p.tTopo,W:Lvp.W,L:Lvp.H,qty:2*nF};
  const CC={mark:'CC1',desc:'Chapa de emenda da cumeeira',t:p.tTopo,W:Lc.W,L:Lc.H,qty:2*nF};
  const clT=cleat(Tp,p.dParT,10),clG=cleat(TRp,p.dParT,10);
  const ST={mark:'ST1',desc:'Suporte de terça',t:clT.t,W:clT.W,L:clT.H,qty:2*nT*nF};
  const nGo=[...girtEnds.values()].reduce((a,b)=>a+b,0);
  const STL={mark:'ST2',desc:'Suporte de travessa',t:clG.t,W:clG.W,L:clG.H,qty:2*girtZ.length*nF+[...girtEnds.keys()].length};
  const plates=[PB,PB2,CT,CC,CP,ST,STL,CM].filter(x=>x.qty>0);
  plates.forEach(x=>{x.kgUn=x.t*x.W*x.L*7.85e-6;x.kgTot=x.kgUn*x.qty;});

  // reconhecimento: cada nó do modelo é classificado pelas peças que se encontram nele;
  // nós com as mesmas peças, perfis e geometria recebem a mesma marca de ligação
  const nodes=[];
  ys.forEach((y,k)=>{const sides=(k===0||k===nV)?1:2;
    for(let s=0;s<2;s++){
      nodes.push({kind:'LB',key:`LB|${Pp.key}|${p.tBase}|${dCh}`});
      nodes.push({kind:'LVP',key:`LVP|${Pp.key}|${Vp.key}|${p.incl}|${p.nbVP}|${p.dPar}|${p.tTopo}`});
      purS.forEach(()=>nodes.push({kind:'LT',sides,key:`LT|${Tp.key}|${Vp.key}|${sides}`}));
      girtZ.forEach(()=>nodes.push({kind:'LTR',sides,key:`LTR|${TRp.key}|${Pp.key}|${sides}`}));}
    nodes.push({kind:'LC',key:`LC|${Vp.key}|${p.incl}|${p.nbC}|${p.dPar}|${p.tTopo}`});});
  endYs.forEach(()=>pilX.forEach(()=>{nodes.push({kind:'LB',rank:1,key:`LB|${PLp.key}|${p.tBase}|${dCh}`});nodes.push({kind:'LPT',key:`LPT|${PLp.key}|${Vp.key}|${dpt}`});}));
  girtEnds.forEach((n,k)=>{const x=+k.split('|')[1],corner=x===0||x===B;
    nodes.push({kind:'LTR',rank:corner?2:1,sides:corner?1:n,key:`LTR|${TRp.key}|${corner?'canto':PLp.key}|${corner?1:n}`});});
  mfPts.forEach(q=>nodes.push({...q,key:`${q.kind}|${MFp.key}|${q.sides}|${q.kind==='LMF'?Vp.key+Tp.key:Pp.key+TRp.key}`}));
  mem.filter(q=>q.type==='cb'||q.type==='cl').forEach(q=>{
    const v=[q.b[0]-q.a[0],q.b[1]-q.a[1],q.b[2]-q.a[2]],n=Math.hypot(...v);let c;
    if(q.type==='cb'){const u=[q.b[0]-q.a[0],0,q.b[2]-q.a[2]],un=Math.hypot(...u);c=Math.abs(v[0]*u[0]+v[2]*u[2])/(n*un);}
    else c=Math.abs(v[2])/n;
    const ang=Math.round(Math.acos(c)*1800/Math.PI)/10,kind=q.type==='cb'?'LCB':'LCL';
    for(let s=0;s<2;s++)nodes.push({kind,dia:q.prof.d,ang,key:`${kind}|${q.prof.key}|${ang}`});});
  const cmap=new Map();nodes.forEach(nd=>{if(!cmap.has(nd.key))cmap.set(nd.key,{...nd,count:0});cmap.get(nd.key).count++;});
  const KORD=['LB','LVP','LC','LPT','LT','LTR','LMF','LMP','LCB','LCL'];
  const conns=[...cmap.values()].sort((a,b)=>KORD.indexOf(a.kind)-KORD.indexOf(b.kind)||(a.rank||0)-(b.rank||0)||(b.sides||0)-(a.sides||0));
  const kc={};conns.forEach(c=>{kc[c.kind]=(kc[c.kind]||0)+1;c.mark=c.kind+kc[c.kind];});
  const A325='Parafuso ASTM A325 com porca e arruela',A307='Parafuso ASTM A307 com porca e arruela';
  conns.forEach(c=>{c.checks=[];
    if(c.kind==='LB'){const pb=c.rank?PB2:PB;c.pb=pb;c.title=c.rank?'Base de pilarete':'Base de pilar';c.desc=`${pb.prof.label} soldado na ${pb.mark} · 4 chumbadores ø${numBR(dCh)}`;
      c.bolts=[[`Chumbador com porca de nivelamento, porca e arruela, L = ${Lch} mm`,dCh,pb.holes.length]];
      c.desc=`${pb.prof.label} soldado na ${pb.mark} · ${pb.eng?'engastada, 4':'rotulada, 2'} chumbadores ø${numBR(dCh)}`;
      if(pb.eng&&ed<eCh)c.checks.push(`Borda da placa de ${ed} mm, menor que ${eCh} mm.`);
      if(pb.g<3*dCh)c.checks.push(`Distância entre chumbadores de ${pb.g} mm, menor que 3d.`);
      if(!pb.eng&&pb.g>pb.prof.bf)c.checks.push(`Chumbadores afastados ${pb.g} mm, mais que a largura da mesa (${pb.prof.bf} mm).`);
      if(!pb.eng&&pb.prof.d/2-pb.prof.tf<clrOf(dCh))c.checks.push('Perfil baixo demais para chumbadores entre as mesas.');}
    else if(c.kind==='LPT'){c.title='Topo do pilarete na viga';c.desc=`CP1 com furos oblongos verticais · 2 parafusos ø${numBR(dpt)}`;
      c.bolts=[[A325,dpt,2]];const livre=PLp.d-2*PLp.tf-10;
      if(CP.W>livre)c.checks.push(`A chapa CP1 (${CP.W} mm) não cabe entre as mesas do pilarete ${PLp.label} (${nf0.format(livre)} mm livres).`);
      if((PLp.bf-PLp.tw)/2<clrOf(dpt)-5)c.checks.push(`Mesa estreita no pilarete: pouca folga para apertar o parafuso.`);
      if((Vp.bf-PLp.tw)/2<10)c.checks.push('Pilarete mais largo que a mesa da viga.');}
    else if(c.kind==='LMF'||c.kind==='LMP'){const col=c.kind==='LMP',er=edgeOf(p.dParT)[1];
      c.title=(col?'Mão-francesa no pilar':'Mão-francesa na viga')+(c.sides===2?', dos dois lados':', de um lado');
      c.desc=`${c.sides} ${MFp.label} · ${2*c.sides} parafusos ø${numBR(p.dParT)} · chapa CM1`;c.bolts=[[A307,p.dParT,2*c.sides]];
      if(MFp.bf/2<er)c.checks.push(`Aba de ${MFp.bf} mm pequena para parafuso ø${numBR(p.dParT)}: furo no meio da aba fica a ${numBR(MFp.bf/2)} mm da borda (mínimo ${er} mm).`);
      const T2=col?TRp:Tp;if(cMF-(T2.t||T2.tf)<clrOf(p.dParT))c.checks.push(`Furo na ${col?'travessa':'terça'} muito perto da mesa.`);
      if(!col&&mfLbV>LB_MAX+1)c.checks.push(`Mão-francesa a cada ${nf2.format(mfLbV/1000)} m: o Manual de Galpões Gerdau recomenda conter a mesa comprimida da viga a cada 2,5 m no máximo.`);}
    else if(c.kind==='LVP'){c.title='Viga-pilar (beiral)';c.desc=`Chapa de topo CT1 estendida · ${p.nbVP} parafusos ø${numBR(p.dPar)}`;
      c.bolts=[[A325,p.dPar,p.nbVP]];c.checks=checkEndPlate(Lvp,Vp,Pp);
      if(Pp.kind!=='W'||Vp.kind!=='W')c.checks.push('Pórtico com perfil Ue: este detalhe foi pensado para perfil W.');}
    else if(c.kind==='LC'){c.title='Emenda da cumeeira';c.desc=`Duas chapas CC1 · ${p.nbC} parafusos ø${numBR(p.dPar)}`;

class Dwg{

function sectionPts(pr){

  d.T(bb.x0,y-ts*1.5,`${c.count} ocorrências · ${c.desc}`,'ANOT',{h:ts*.75});
  return d;}
function breakH(d,x1,x2,y){const m=(x1+x2)/2,k=d.ts*.5;d.P([[x1,y],[m-k,y],[m-k/2,y+k],[m+k/2,y-k],[m+k,y],[x2,y]],'ANOT',false);}
function breakV(d,x,y1,y2){const m=(y1+y2)/2,k=d.ts*.5;d.P([[x,y1],[x,m-k],[x+k,m-k/2],[x-k,m+k/2],[x,m+k],[x,y2]],'ANOT',false);}
function rrect(d,cx,cy,ux,uy,a,b,ly){const nx=-uy,ny=ux;d.P([[-1,-1],[1,-1],[1,1],[-1,1]].map(([p,q])=>[cx+ux*a/2*p+nx*b/2*q,cy+uy*a/2*p+ny*b/2*q]),ly);}
// parafuso de eixo horizontal: cabeça à direita de x2, porca à esquerda de x1
function boltH(d,x1,x2,z,dia){d.L(x1-dia*.3,z,x2+dia*.3,z,'CHAPA');d.R(x2,z-dia*.8,dia*.6,dia*1.6,'CHAPA');d.R(x1-dia*.75,z-dia*.8,dia*.75,dia*1.6,'CHAPA');}

  L.rows.forEach(r=>[-L.g/2,L.g/2].forEach(x=>d.C(ox+x,oz+r,L.hole/2,'CHAPA')));

function detLB(m,c,ts){

function detVP(m,c,ts){

function romaneioCSV(m){const n=v=>String(Math.round(v*100)/100).replace('.',',');const L=[];
  L.push(['Obra',m.p.obra].join(';'));L.push('');
  L.push('Marca;Descrição;Perfil;Qtd;Comprimento (mm);kg/m;kg/un;kg total');
  m.groups.forEach(g=>L.push([g.mark,DESC[g.type],g.prof.label,g.qty,g.cut,n(g.prof.kgm),n(g.kgUn),n(g.kgTot)].join(';')));
  L.push('');L.push('Marca;Descrição;Espessura (mm);Largura (mm);Comprimento (mm);Qtd;kg/un;kg total');
  m.plates.forEach(x=>L.push([x.mark,x.desc,numBR(x.t),x.W,x.L,x.qty,n(x.kgUn),n(x.kgTot)].join(';')));
  L.push('');L.push('Descrição;Diâmetro (mm);Qtd');m.bolts.forEach(b=>L.push([b.desc,numBR(b.dia),b.qty].join(';')));
  L.push('');L.push(['Peso total (kg)',n(m.kgTot)].join(';'));return L.join('\r\n');}

/* ---------------- DXF (R12 ASCII, 1 unidade = 1 mm) ---------------- */
const LAYERS={EIXO:[8,'CENTER'],PILAR:[5],VIGA:[1],TERCA:[3],TRAVESSA:[4],CONTRAV:[6],CHAPA:[30],COTA:[2],TEXTO:[7],ANOT:[9]};
const dxfStr=s=>s.replace(/[^\x20-\x7e]/g,c=>'\\U+'+c.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0'));
function toDXF(list){
  const o=[],w=(c,v)=>{o.push(String(c),String(v));},f=v=>(Math.round(v*1000)/1000).toFixed(3);
  w(0,'SECTION');w(2,'HEADER');w(9,'$ACADVER');w(1,'AC1009');w(0,'ENDSEC');
  w(0,'SECTION');w(2,'TABLES');
  w(0,'TABLE');w(2,'LTYPE');w(70,2);
  w(0,'LTYPE');w(2,'CONTINUOUS');w(70,0);w(3,'Solid line');w(72,65);w(73,0);w(40,'0.0');
  w(0,'LTYPE');w(2,'CENTER');w(70,0);w(3,'Center ____ _ ____');w(72,65);w(73,4);w(40,'2000.0');w(49,'1250.0');w(49,'-250.0');w(49,'250.0');w(49,'-250.0');
  w(0,'ENDTAB');
  w(0,'TABLE');w(2,'LAYER');w(70,Object.keys(LAYERS).length);
  for(const [n,[col,lt]] of Object.entries(LAYERS)){w(0,'LAYER');w(2,n);w(70,0);w(62,col);w(6,lt||'CONTINUOUS');}
  w(0,'ENDTAB');w(0,'ENDSEC');
  w(0,'SECTION');w(2,'ENTITIES');
  for(const {d,ox,oy} of list)for(const e of d.e){
    if(e.t==='l'){w(0,'LINE');w(8,e.ly);w(10,f(e.x1+ox));w(20,f(e.y1+oy));w(30,'0.0');w(11,f(e.x2+ox));w(21,f(e.y2+oy));w(31,'0.0');}
    else if(e.t==='c'){w(0,'CIRCLE');w(8,e.ly);w(10,f(e.x+ox));w(20,f(e.y+oy));w(30,'0.0');w(40,f(e.r));}
    else{w(0,'TEXT');w(8,e.ly);w(10,f(e.x+ox));w(20,f(e.y+oy));w(30,'0.0');w(40,f(e.h));w(1,dxfStr(e.s));if(e.rot)w(50,f(e.rot));
      if(e.an!=='start'){w(72,e.an==='middle'?1:2);w(11,f(e.x+ox));w(21,f(e.y+oy));w(31,'0.0');}}}
  w(0,'ENDSEC');w(0,'EOF');return o.join('\r\n')+'\r\n';}
function dxfAll(m){const list=[];let cur=0;
  VIEWS.filter(v=>v.fn).forEach(v=>{const d=v.fn(m),bb=d.bbox();list.push({d,ox:cur-bb.x0,oy:-bb.y0});cur+=(bb.x1-bb.x0)+Math.max(3000,(bb.x1-bb.x0)*.15);});
  return toDXF(list);}
function dxfView(m,id){const v=VIEWS.find(x=>x.id===id&&x.fn);if(!v)return null;return toDXF([{d:v.fn(m),ox:0,oy:0}]);}

/* ---------------- Arquivos e avisos ---------------- */
function fileBase(){return (P.obra||'projeto').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'').slice(0,50)||'projeto';}
let toastT;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3800);}
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d;},()=>{});}catch(e){}
function download(name,text,type){
  if(DL){let fn=name,note='';if(/\.dxf$/i.test(fn)){fn+='.txt';note=' Renomeie tirando o ".txt" do final para abrir no CAD.';}
    DL.save({filename:fn,data:text}).then(()=>toast('Arquivo salvo.'+note),e=>{if(e&&e.code==='declined')return;toast('Não foi possível salvar aqui. Use os botões de copiar.');});return;}
  try{const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast(`${name} gerado. Se o download não começar, use os botões de copiar.`);}
  catch(e){toast('O download foi bloqueado aqui. Use os botões de copiar.');}}
function copyText(text,ok){try{navigator.clipboard.writeText(text).then(()=>toast(ok),()=>toast('A cópia foi bloqueada neste navegador.'));}catch(e){toast('A cópia foi bloqueada neste navegador.');}}

/* ---------------- Interface ---------------- */
let M=null,TAB=(()=>{try{return JSON.parse(localStorage.getItem(STORE)||'{}').tab||'modelo';}catch(e){return 'modelo';}})();
if(!VIEWS.some(v=>v.id===TAB))TAB='modelo';

function buildForm(){
  let h='';
  for(const g of GROUPS){h+=`<details${g.open?' open':''}><summary>${g.t}</summary><div class="fields">`;
    for(const f of g.f){const id='f_'+f.id;
      if(f.kind==='num')h+=`<div class="f"><label for="${id}">${f.label}</label><span class="in"><input id="${id}" type="number" inputmode="decimal" step="${f.step}" min="${f.min}" max="${f.max}"><span class="unit">${f.unit}</span></span></div>`;
      else if(f.kind==='opt')h+=`<div class="f"><label for="${id}">${f.label}</label><span class="in"><select id="${id}">${f.opts.map(o=>`<option value="${o}">${o===0&&f.zero?f.zero:numBR(o)}</option>`).join('')}</select><span class="unit">${f.unit}</span></span></div>`;
      else if(f.kind==='chk')h+=`<div class="f ck"><label for="${id}">${f.label}</label><input id="${id}" type="checkbox"></div>`;
      else if(f.kind==='prof')h+=`<div class="f wide"><label for="${id}">${f.label}</label><select id="${id}">${f.opts().map(([gl,arr])=>`<optgroup label="${gl}">${arr.map(c=>`<option value="${c.key}">${esc(c.label)} · ${nf2.format(c.kgm)} kg/m</option>`).join('')}</optgroup>`).join('')}</select></div>`;
      else h+=`<div class="f wide"><label for="${id}">${f.label}</label><input id="${id}" type="text" maxlength="120"></div>`;}
    h+='</div></details>';}
  const form=$('#form');form.innerHTML=h;fillForm();
  let tmr;const on=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{P=readForm();update();},140);};
  form.addEventListener('input',on);form.addEventListener('change',on);form.addEventListener('submit',e=>e.preventDefault());}
function fillForm(){for(const f of FIELDS){const el=document.getElementById('f_'+f.id);if(!el)continue;if(f.kind==='chk')el.checked=!!P[f.id];else el.value=P[f.id];}}
function readForm(){const o={};for(const f of FIELDS){const el=document.getElementById('f_'+f.id);o[f.id]=el?(f.kind==='chk'?el.checked:el.value):P[f.id];if((f.kind==='num')&&o[f.id]==='')o[f.id]=P[f.id];}return sanitize(o);}

function buildTabs(){
  $('#tabs').innerHTML=VIEWS.map(v=>`<button type="button" class="tab" role="tab" data-v="${v.id}" aria-selected="${v.id===TAB}">${v.label}</button>`).join('');
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;TAB=b.dataset.v;
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===TAB));saveState();renderView();});}

function renderSummary(m){
  const k=(l,v,s)=>`<div class="kpi"><span>${l}</span><b>${v}</b>${s?`<i>${s}</i>`:''}</div>`;
  $('#summary').innerHTML=
    k('Aço total',nf0.format(m.kgTot)+' kg',`perfis ${nf0.format(m.kgPerf)} · chapas ${nf0.format(m.kgCh)}`)+
    k('Taxa de aço',nf1.format(m.kgTot/m.area)+' kg/m²',nf0.format(m.area)+' m² cobertos')+
    k('Pórticos',m.nF,`a cada ${nf2.format(m.e/1000)} m`)+
    k('Marcas',m.groups.length+m.plates.length,`${m.groups.length} perfis · ${m.plates.length} chapas`)+
    k('Terças por água',m.purS.length,`${nf0.format(Math.round((m.purS[1]-m.purS[0])))} mm na rampa`)+
    k('Ligações',m.conns.length+' tipos',m.nAlert?`${m.nAlert} alerta(s)`:'sem alertas');
  $('#warns').innerHTML=m.warns.map(w=>`<div class="warn">${esc(w)}</div>`).join('');}

function renderView(){
  const is3d=TAB==='modelo',isRom=TAB==='romaneio';
  $('#lig').hidden=TAB!=='ligacoes';if(TAB==='ligacoes')renderLigacoes(M);
  $('#stage').hidden=isRom;$('#rom').hidden=!isRom;
  $('#cv').hidden=!is3d;$('#legend').hidden=!is3d;$('#svg').toggleAttribute('hidden',is3d||isRom);
  $('#bDxfView').disabled=is3d||isRom;
  $('#hint').textContent=is3d?'Arraste para girar · role ou use pinça para aproximar · duplo clique para enquadrar':'Arraste para mover · role ou use pinça para zoom · duplo clique para enquadrar';
  if(isRom)renderRomaneio(M);else if(is3d){legend3D();draw3D();}else renderSVG(VIEWS.find(v=>v.id===TAB).fn(M));}

function update(){M=build(P);renderSummary(M);renderView();saveState();}

/* ponteiros: pan, zoom e pinça para SVG e 3D */
function bindPointer(el,on){
  const pts=new Map();let last=null,lastD=0;
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};lastD=0;});
  el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const [a,b]=[...pts.values()],dd=Math.hypot(a.x-b.x,a.y-b.y);if(lastD)on.zoom((a.x+b.x)/2,(a.y+b.y)/2,lastD/dd);lastD=dd;return;}
    on.drag(e.clientX-last.x,e.clientY-last.y,e.shiftKey);last={x:e.clientX,y:e.clientY};});
  const up=e=>{pts.delete(e.pointerId);lastD=0;if(pts.size===1){const p=[...pts.values()][0];last={x:p.x,y:p.y};}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();on.zoom(e.clientX,e.clientY,Math.exp(e.deltaY*.0015));},{passive:false});
  el.addEventListener('dblclick',on.fit);}
bindPointer($('#svg'),{drag:(dx,dy)=>panBy(dx,dy),zoom:(x,y,f)=>zoomAt(x,y,f),fit:()=>{VB={...FITVB};applyVB();}});
bindPointer($('#cv'),{drag:(dx,dy,sh)=>{if(sh){V3.px+=dx;V3.py+=dy;}else{V3.yaw+=dx*.008;V3.pitch=Math.max(-.2,Math.min(1.5,V3.pitch+dy*.006));}draw3D();},
  zoom:(x,y,f)=>{V3.zoom=Math.max(.2,Math.min(12,V3.zoom/f));draw3D();},fit:()=>{Object.assign(V3,{yaw:-.75,pitch:.42,zoom:1,px:0,py:0});draw3D();}});
$('#bFit').onclick=()=>{if(TAB==='modelo'){Object.assign(V3,{yaw:-.75,pitch:.42,zoom:1,px:0,py:0});draw3D();}else if(FITVB){VB={...FITVB};applyVB();}};
new ResizeObserver(()=>{if(TAB==='modelo'&&M)draw3D();}).observe($('#stage'));
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(TAB==='modelo')draw3D();});}catch(e){}
new MutationObserver(()=>{if(TAB==='modelo'&&M)draw3D();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

$('#bDxfView').onclick=()=>{const t=dxfView(M,TAB);if(t)download(`${fileBase()}_${TAB}.dxf`,t,'application/dxf');};
$('#bDxfAll').onclick=()=>download(`${fileBase()}_completo.dxf`,dxfAll(M),'application/dxf');
$('#bCopyDxf').onclick=()=>{const t=dxfView(M,TAB)||dxfAll(M);copyText(t,'DXF copiado. Cole num arquivo de texto e salve com a extensão .dxf.');};
$('#bSave').onclick=()=>download(`${fileBase()}.json`,JSON.stringify({app:'engenhar-metalica',versao:'0.1',p:P},null,2),'application/json');
$('#bOpen').onclick=()=>$('#fileOpen').click();
$('#fileOpen').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);P=sanitize(o.p||o);fillForm();update();toast('Projeto aberto.');}catch(err){toast('Arquivo inválido: escolha um .json salvo por este programa.');}};
  rd.readAsText(f);e.target.value='';};
$('#bReset').onclick=()=>{P={...DEFAULTS};fillForm();update();toast('Exemplo restaurado.');};

buildForm();buildTabs();update();
window.__engenhar={build,dxfAll,romaneioCSV,DET,renderSVG,get M(){return M;}};
})();
</script>
